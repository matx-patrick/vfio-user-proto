[package]
name = "vfio_user_server"
version = "0.1.2"
authors = ["The Cloud Hypervisor Authors"]
edition = "2021"
license = "Apache-2.0"
description = "Support for vfio-user devices"
repository = "https://github.com/rust-vmm/vfio-user"

[[example]]
name = "gpio"

[dependencies]
vfio-user-proto.workspace = true
zerocopy.workspace = true
libc = "0.2.139"
log = "0.4.17"
serde.workspace = true
serde_json = "1.0.93"
thiserror = { workspace = true }

[dev-dependencies]
argh = "0.1.9"
env_logger = "0.11.8"
